[project]
name = "tianshu-segmentation-expert"
version = "1.0.0"
description = "SegFormer-B5 expert service for Tianshu"
requires-python = ">=3.10,<3.11"
dependencies = [
    "mmcv==2.1.0",
    "mmengine==0.10.7",
    "mmsegmentation==1.2.2",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "torch==2.1.0",
    "torchvision==0.16.0",
]

[tool.uv]
package = false
find-links = [
    "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1/index.html",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
