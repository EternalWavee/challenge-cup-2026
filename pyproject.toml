[project]
name = "tianshu-remote-sensing"
version = "1.0.0"
description = "Tianshu multimodal remote-sensing inference service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.136.3",
    "ms-swift==4.2.2",
    "numpy==2.4.6",
    "peft==0.18.1",
    "pillow==11.3.0",
    "python-multipart==0.0.32",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers==5.7.0",
    "uvicorn[standard]==0.49.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
